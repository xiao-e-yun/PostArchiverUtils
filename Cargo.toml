[package]
name = "post-archiver-utils"
version = "0.0.1"
edition = "2024"
license = "BSD-3-Clause"
description = "A set of utilities for Post Archiver"
authors = ["xiao-e-yun <me@xiaoeyun.me>"]
repository = "https://github.com/xiao-e-yun/PostArchiverUtils"

[dependencies]
console = "0.16"
log = "0.4"
post-archiver = { version = "0.6", features = ["importer"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls-alpn"] }
reqwest-retry = "0.7"
futures = "0.3"
tokio = { version = "1.52", features = ["macros", "fs", "io-util", "time", "sync"] }
thiserror = "2"
http = "1.3"
serde = "1"
serde_json = "1"
governor = "0.10"
fastrand = "2.4.1"
indicatif = "0.18.4"
env_logger = "0.11.11"
indicatif-log-bridge = "0.2.3"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "net", "io-util"] }
tempfile = "3"
